# Standalone, image-only manifest fetched by Hostinger's Docker Manager API.
# Do not change project/volume names or host paths after the first deployment.
name: scran-hostinger

services:
  scran:
    image: ${SCRAN_IMAGE:?Set the immutable app image reference}
    command: ['sh', '/app/start-hostinger.sh']
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    environment:
      # GitHub environment secrets are sent to Docker Manager on every deploy.
      # Missing values fail deployment rather than starting with empty secrets.
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set the OPENAI_API_KEY GitHub environment secret}
      AUTH_SECRET: ${AUTH_SECRET:?Set the AUTH_SECRET GitHub environment secret}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_EXTRACTIONS_PER_USER_DAY: ${MAX_EXTRACTIONS_PER_USER_DAY:-60}
      MAX_EXTRACTIONS_PER_DAY: ${MAX_EXTRACTIONS_PER_DAY:-200}
      MAX_STORED_SOURCE_BYTES: ${MAX_STORED_SOURCE_BYTES:-5368709120}
      MAX_CONCURRENT_EXTRACTIONS: ${MAX_CONCURRENT_EXTRACTIONS:-2}
      SCRAN_RELEASE: ${SCRAN_RELEASE:?Set the release commit SHA}
      BASE_URL: https://${SCRAN_HOST:-recipes.alastair.sh}
      COOKIE_SECURE: 'true'
      AUTH_IP_HEADER: x-real-ip
      PORT: '3000'
      DATA_DIR: /data
      DATABASE_URL: /data/scran.db
    volumes:
      - /opt/scran/data:/data
      - /opt/scran/backups:/backups
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "const r = await fetch('http://127.0.0.1:3000/api/health'); process.exit(r.ok ? 0 : 1)",
        ]
      interval: 30s
      timeout: 5s
      # Allow a large consistent backup to finish before declaring startup bad.
      start_period: 5m
      retries: 3

  caddy:
    image: ${CADDY_IMAGE:?Set the immutable proxy image reference}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      scran:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    environment:
      SCRAN_HOST: ${SCRAN_HOST:-recipes.alastair.sh}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:2019/config/',
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  caddy_data:
    name: scran-hostinger-caddy-data
  caddy_config:
    name: scran-hostinger-caddy-config
