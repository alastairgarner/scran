name: Verify and deploy to Hostinger

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      diagnose:
        description: Read deployment status only; do not build or deploy
        type: boolean
        default: false

permissions:
  contents: read

# Never cancel a deployment midway through stopping/replacing its containers.
concurrency:
  group: hostinger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: hostinger-production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Read provider container status without changing the deployment
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          HOSTINGER_VM_ID: ${{ vars.HOSTINGER_VM_ID }}
        run: |
          python3 - <<'PY'
          import json, os, runpy
          probe = runpy.run_path('scripts/wait-hostinger.py', run_name='probe')
          vm = os.environ['HOSTINGER_VM_ID']
          if not vm.isdigit():
              raise SystemExit('VM ID must be numeric')
          url = f"{probe['API']}/{vm}/docker/scran-hostinger/containers"
          containers = probe['get_json'](url, os.environ['HOSTINGER_API_KEY'])
          if not isinstance(containers, list):
              raise SystemExit('Unexpected provider response shape')
          for container in containers:
              print(json.dumps({key: container.get(key) for key in ('name', 'image', 'state', 'health', 'status')}))
          if not containers:
              print('No containers reported for scran-hostinger')
          PY

  verify:
    if: github.event_name != 'workflow_dispatch' || !inputs.diagnose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: python3 -m unittest discover -s scripts -p 'test_hostinger.py' -v
      - name: Validate the standalone provider manifest without resolving VPS secrets
        run: docker compose -f compose.hostinger.yaml config --no-interpolate --no-env-resolution --quiet

  release:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.HOSTINGER_VM_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      app: ${{ steps.images.outputs.app }}
      caddy: ${{ steps.images.outputs.caddy }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build both images from this exact commit
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "ghcr.io/$repository:$GITHUB_SHA" .
          docker build -f deploy/Dockerfile.caddy \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "ghcr.io/$repository-caddy:$GITHUB_SHA" .
      - name: Test the release backup entrypoint before publishing
        env:
          HOSTINGER_TEST_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        # GitHub repository names may contain uppercase letters; tags cannot.
        run: |
          export HOSTINGER_TEST_IMAGE="${HOSTINGER_TEST_IMAGE,,}"
          python3 -m unittest discover -s scripts -p 'test_hostinger.py' -v
      - name: Publish release images and record immutable references
        id: images
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for image in "$repository" "$repository-caddy"; do
            docker push "ghcr.io/$image:$GITHUB_SHA"
          done
          app=$(docker image inspect "ghcr.io/$repository:$GITHUB_SHA" --format '{{index .RepoDigests 0}}')
          caddy=$(docker image inspect "ghcr.io/$repository-caddy:$GITHUB_SHA" --format '{{index .RepoDigests 0}}')
          printf 'app=%s\ncaddy=%s\n' "$app" "$caddy" >> "$GITHUB_OUTPUT"

  deploy:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: hostinger-production
    env:
      HOSTINGER_VM_ID: ${{ vars.HOSTINGER_VM_ID }}
      HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
      SCRAN_HOST: ${{ vars.SCRAN_HOST || 'recipes.alastair.sh' }}
      SCRAN_IMAGE: ${{ needs.release.outputs.app }}
      CADDY_IMAGE: ${{ needs.release.outputs.caddy }}
      SCRAN_RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check deployment settings before contacting Hostinger
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[0-9]+', os.environ['HOSTINGER_VM_ID']), 'Set a numeric HOSTINGER_VM_ID'
          assert re.fullmatch(r'[a-z0-9]+(?:[.-][a-z0-9]+)*', os.environ['SCRAN_HOST']), 'Set SCRAN_HOST to a hostname'
          token = os.environ['HOSTINGER_API_KEY']
          assert token and not any(c in token for c in '\n\r"\\`$'), 'Set a valid Hostinger API key'
          # The pinned provider action interpolates these values inside shell
          # double quotes. Accept token-safe values; reject shell/line injection.
          assert re.fullmatch(r'[A-Za-z0-9_.+/=-]+', os.environ['OPENAI_API_KEY']), 'Set a token-safe OPENAI_API_KEY'
          assert re.fullmatch(r'[A-Za-z0-9_.+/=-]{32,}', os.environ['AUTH_SECRET']), 'Set AUTH_SECRET using openssl rand -hex 32'
          PY
      # Hostinger's support article still names deploy-action@v1. The actual
      # published action is deploy-on-vps; pin the reviewed v2 commit.
      - name: Ask Docker Manager to deploy this commit
        uses: hostinger/deploy-on-vps@b0868cec74bfa63af6bfa7bdb0dfee2f9bef13ea # v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: scran-hostinger
          docker-compose-path: compose.hostinger.yaml
          environment-variables: |
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
            SCRAN_IMAGE=${{ needs.release.outputs.app }}
            CADDY_IMAGE=${{ needs.release.outputs.caddy }}
            SCRAN_RELEASE=${{ github.sha }}
            SCRAN_HOST=${{ env.SCRAN_HOST }}
      - name: Verify the new images, container health and public HTTPS
        run: python3 scripts/wait-hostinger.py
